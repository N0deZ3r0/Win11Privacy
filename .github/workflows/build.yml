name: Сборка

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Проверка и сборка
    runs-on: windows-latest

    # Сборка и проверки только читают репозиторий. Право писать (релиз) и секрет
    # каталога winget есть только у отдельного задания «release» ниже, которое
    # запускается лишь для тегов: раньше оно было у всего задания, включая
    # запуск тестов и проверок.
    permissions:
      contents: read

    steps:
      # Сторонние действия закреплены хешем коммита, а не тегом: тег можно
      # переставить на другой коммит. Версия — в комментарии; обновлять — осознанно.
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Сверить движок со сборкой из частей
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # исходники движка — части в engine/, а в exe и в релиз идёт собранный файл
          python tools/build_engine.py --check
          if ($LASTEXITCODE -ne 0) { throw "Win11-Privacy-Engine.ps1 разошёлся с engine/ — соберите: python tools/build_engine.py" }

      - name: Проверить синтаксис движка
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
                    (Resolve-Path .\Win11-Privacy-Engine.ps1).Path, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=Win11-Privacy-Engine.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              exit 1
          }
          # каждая часть — законченный кусок: функция или блок не начинаются
          # в одной части, чтобы закончиться в другой
          $bad = 0
          foreach ($part in Get-ChildItem .\engine\*.ps1) {
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($part.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) {
                  Write-Host "::error file=engine/$($part.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  $bad++
              }
          }
          if ($bad -gt 0) { exit 1 }
          Write-Host "Движок: синтаксис в порядке, каждая часть в engine/ разбирается сама по себе"

      - name: Проверить перевод
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/gen_lang.py
          git diff --exit-code -- Lang.cs
          if ($LASTEXITCODE -ne 0) { throw "Lang.cs разошёлся с lang-en*.txt — перегенерируйте: python tools/gen_lang.py" }
          python tools/check_lang.py
          if ($LASTEXITCODE -ne 0) { throw "есть строки интерфейса без английского перевода — добавьте их в lang-en4.txt" }
          Write-Host "Перевод: Lang.cs собран из словарей, непереведённых строк нет"

      - name: Сверить версии
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ui = (Select-String -Path AppInfo.cs -Pattern 'Version = "([0-9.]+)"').Matches[0].Groups[1].Value
          $eng = (Select-String -Path Win11-Privacy-Engine.ps1 -Pattern "EngineVersion\s*=\s*'([0-9.]+)'").Matches[0].Groups[1].Value
          Write-Host "интерфейс: $ui, движок: $eng"
          if ($ui -ne $eng) { throw "версии разошлись: AppInfo.cs = $ui, движок = $eng" }
          # ту же версию Windows показывает в свойствах файла
          python tools/set_version.py --check
          if ($LASTEXITCODE -ne 0) { throw "версия в app.res отстала — запустите python tools/set_version.py" }
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
              if ($tag -ne $ui) { throw "тег $tag не совпадает с версией в программе ($ui)" }
              Write-Host "тег совпадает с версией"
              # Описание релиза — из CHANGELOG.md. Раздела этой версии нет —
              # сборка падает здесь, до сборки, а не выпускает релиз без слов.
              python tools/release_notes.py --version $tag --out release-notes.md
              if ($LASTEXITCODE -ne 0) { throw "в CHANGELOG.md нет раздела «## $tag» — опишите, что нового" }
          }

      - name: Проверки поведения движка
        timeout-minutes: 20
        shell: powershell
        # Сообщения здесь — латиницей: шаг идёт в Windows PowerShell 5.1, а
        # GitHub сохраняет его текст без BOM, и кириллица в логе превращалась в
        # кракозябры. Сами тесты лежат в файле с BOM и пишут по-русски нормально.
        run: |
          .\tests\engine-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "engine behaviour checks failed (see [FAIL] lines above)" }

      - name: Pester-проверки движка
        timeout-minutes: 10
        shell: powershell
        # Latin-only text here (the step runs in Windows PowerShell 5.1). The
        # test file works with both the in-box Pester 3.4 and Pester 5.
        run: |
          $pv = (Get-Module Pester -ListAvailable | Sort-Object Version -Descending | Select-Object -First 1).Version
          Write-Host "Pester $pv"
          Import-Module Pester -RequiredVersion $pv -Force
          if ($pv.Major -ge 5) { $r = Invoke-Pester -Path .\tests\engine.Tests.ps1 -PassThru -Output Detailed }
          else { $r = Invoke-Pester -Script .\tests\engine.Tests.ps1 -PassThru }
          if ($r.FailedCount -gt 0 -or $r.PassedCount -eq 0) { throw "Pester: $($r.FailedCount) failed, $($r.PassedCount) passed" }

      # Единственная проверка, которая по-настоящему отвечает за откат:
      # настройки применяются на живой системе, а потом каждое значение
      # сверяется с тем, что было до. Машина здесь одноразовая.
      - name: Применить и откатить на живой системе
        timeout-minutes: 25
        shell: powershell
        env:
          WIN11_ROUNDTRIP: '1'
        run: |
          .\tests\roundtrip.ps1
          if ($LASTEXITCODE -ne 0) { throw "rollback did not return the system to its original state (see [FAIL] lines above)" }

      - name: Проверки интерфейса
        timeout-minutes: 10
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /define:SELFTEST /main:Win11Privacy.SelfTest /out:selftest.exe `
              /reference:System.dll /reference:System.Core.dll `
              /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
              /resource:Win11-Privacy-Engine.ps1,engine.ps1 `
              /resource:app.ico,app.ico /resource:app.png,app.png `
              *.cs
          if ($LASTEXITCODE -ne 0) { throw "сборка проверок интерфейса не удалась" }
          .\selftest.exe
          $code = $LASTEXITCODE
          Remove-Item selftest.exe -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "проверки интерфейса не прошли" }

      - name: Прогнать страницы интерфейса
        timeout-minutes: 20
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /define:UITEST /out:uitest.exe `
              /reference:System.dll /reference:System.Core.dll `
              /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
              /resource:Win11-Privacy-Engine.ps1,engine.ps1 `
              /resource:app.ico,app.ico /resource:app.png,app.png `
              *.cs
          if ($LASTEXITCODE -ne 0) { throw "тестовая сборка интерфейса не удалась" }
          # Тестовая сборка печатает в UTF-8, и читать её надо так же. Иначе
          # «ОБРЕЗАНО» и «ВЫЛЕЗ» приходят вопросительными знаками, и проверки
          # ниже не срабатывают — так и было, пока кодировку не задали явно.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:WIN11_TEST_MOCK = '1'
          $env:WIN11_TEST_DELAY = '1500'
          $env:WIN11_TEST_DUMP = '1'      # вместе со снимком печатается геометрия страницы
          $pages = @('home','settings','xray','dossier','gdid','audit','monitor','apps','startup','guard','changes','timeline','log','about')
          $bad = 0
          # два размера окна: обычный и самый маленький — там текст обрезается первым
          foreach ($size in @('normal', 'min')) {
              if ($size -eq 'min') { $env:WIN11_TEST_SIZE = 'min' } else { Remove-Item Env:WIN11_TEST_SIZE -ErrorAction SilentlyContinue }
              foreach ($lang in @('ru','en')) {
                  if ($lang -eq 'en') { $env:WIN11_TEST_EN = '1' } else { Remove-Item Env:WIN11_TEST_EN -ErrorAction SilentlyContinue }
                  foreach ($page in $pages) {
                      $what = "$page ($lang, $size)"
                      $env:WIN11_TEST_PAGE = $page
                      $shot = "shot-$size-$lang-$page.png"
                      $env:WIN11_TEST_SHOT = $shot
                      $out = (& .\uitest.exe 2>&1 | Out-String)
                      $count = 0
                      if ($out -match 'controls=(\d+)') { $count = [int]$Matches[1] }
                      if ($out -notmatch 'UITEST ok') {
                          Write-Host "::error::страница $what не открылась"
                          Write-Host $out
                          $bad++
                      } elseif (-not (Test-Path $shot)) {
                          Write-Host "::error::страница $what не дала снимок"
                          $bad++
                      } elseif ($count -lt 3) {
                          Write-Host "::error::страница $what осталась пустой (контролов: $count)"
                          $bad++
                      } elseif ($out -match 'ОБРЕЗАНО') {
                          Write-Host "::error::на странице $what обрезан текст"
                          Write-Host (($out -split "`n" | Where-Object { $_ -match 'ОБРЕЗАНО' }) -join "`n")
                          $bad++
                      } elseif ($out -match 'ВЫЛЕЗ') {
                          Write-Host "::error::на странице $what элемент вылез за родителя"
                          Write-Host (($out -split "`n" | Where-Object { $_ -match 'ВЫЛЕЗ' }) -join "`n")
                          $bad++
                      } else {
                          Write-Host ("  ok: {0}, контролов: {1}" -f $what, $count)
                      }
                  }
              }
          }
          Remove-Item Env:WIN11_TEST_SIZE -ErrorAction SilentlyContinue
          # окно первого запуска: его видят раньше всего остального
          $env:WIN11_TEST_WELCOME = '1'
          $env:WIN11_TEST_PAGE = 'home'
          $env:WIN11_TEST_SHOT = 'shot-welcome-run.png'
          $w = (& .\uitest.exe 2>&1 | Out-String)
          Remove-Item Env:WIN11_TEST_WELCOME -ErrorAction SilentlyContinue
          # разбираем явно: -notmatch в PowerShell 7 не заполняет $Matches,
          # и счётчик читался пустым — проверка падала на исправном окне
          $wm = [regex]::Match($w, 'WELCOME controls=(\d+)')
          if (-not $wm.Success) {
              Write-Host "::error::окно первого запуска не открылось"
              Write-Host $w
              $bad++
          } elseif ([int]$wm.Groups[1].Value -lt 10) {
              Write-Host "::error::окно первого запуска осталось пустым (контролов: $($wm.Groups[1].Value))"
              Write-Host $w
              $bad++
          } else {
              Write-Host ("  ok: окно первого запуска, контролов: {0}" -f $wm.Groups[1].Value)
          }
          Remove-Item uitest.exe, shot-*.png -Force -ErrorAction SilentlyContinue
          if ($bad -gt 0) { throw "страниц с ошибками: $bad" }
          Write-Host "Интерфейс: все страницы открылись на двух языках и в двух размерах окна"

      - name: Собрать Win11Privacy.exe
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe (.NET Framework 4) не найден на агенте сборки" }
          & $csc /nologo /target:winexe /optimize+ /out:Win11Privacy.exe `
              /reference:System.dll /reference:System.Core.dll `
              /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
              /win32res:app.res `
              /resource:Win11-Privacy-Engine.ps1,engine.ps1 `
              /resource:app.ico,app.ico /resource:app.png,app.png `
              *.cs
          if ($LASTEXITCODE -ne 0) { throw "сборка не удалась" }

      - name: Проверить готовый файл
        shell: pwsh
        run: |
          $exe = Get-Item .\Win11Privacy.exe
          Write-Host ("Размер: {0:N0} байт" -f $exe.Length)
          if ($exe.Length -lt 200000) { throw "файл подозрительно мал" }

          # движок должен быть вшит в exe и совпадать с исходником
          $asm = [Reflection.Assembly]::LoadFile($exe.FullName)
          $stream = $asm.GetManifestResourceStream('engine.ps1')
          if ($null -eq $stream) { throw "движок не вшит в exe" }
          $ms = New-Object IO.MemoryStream
          $stream.CopyTo($ms)
          $sha = [Security.Cryptography.SHA256]::Create()
          $embedded = [BitConverter]::ToString($sha.ComputeHash($ms.ToArray()))
          $source = [BitConverter]::ToString($sha.ComputeHash([IO.File]::ReadAllBytes('Win11-Privacy-Engine.ps1')))
          if ($embedded -ne $source) { throw "вшитый движок не совпадает с исходником" }
          Write-Host "Движок вшит и совпадает с исходником"

          # программа обязана запрашивать права администратора
          $manifest = Select-String -Path .\app.manifest -Pattern 'requireAdministrator' -Quiet
          if (-not $manifest) { throw "в манифесте нет requireAdministrator" }
          Write-Host "Манифест: права администратора запрашиваются"

      - name: Посчитать контрольные суммы
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @('Win11Privacy.exe','Win11-Privacy-Engine.ps1')) {
              $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              $lines += "$h  $f"
              Write-Host "$h  $f"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      # Манифест для каталога winget: с ним установка сводится к одной команде,
      # а хеш проверяет сам каталог — вопрос «почему ругается SmartScreen»
      # снимается вместе с ручным скачиванием.
      - name: Собрать манифест winget
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/make_winget.py --sums SHA256SUMS.txt
          $dir = "packaging/winget/$($env:GITHUB_REF_NAME -replace '^v','')"
          Compress-Archive -Path "$dir/*" -DestinationPath winget-manifest.zip -Force
          Get-ChildItem $dir | ForEach-Object { Write-Host $_.Name }

      - name: Сохранить сборку
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Win11Privacy
          path: |
            Win11Privacy.exe
            Win11-Privacy-Engine.ps1
            check-engine.cmd
          retention-days: 30

      # Для тега — то, что уйдёт в релиз, передаётся заданию «release» как есть.
      # Описание релиза — раздел версии из CHANGELOG.md плюс как запустить и
      # какие файлы приложены (собирает tools/release_notes.py на шаге «Сверить
      # версии»); раньше у всех версий оно было одно и то же.
      - name: Передать файлы релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: |
            Win11Privacy.exe
            Win11-Privacy-Engine.ps1
            SHA256SUMS.txt
            winget-manifest.zip
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------- #
  #  Публикация. Только для тегов, отдельным заданием: право писать в
  #  репозиторий, секрет каталога winget и подпись происхождения (аттестация)
  #  есть только здесь, а не у задания, где идут тесты. Файлы берутся из
  #  задания «build» и сверяются с SHA256SUMS.txt перед публикацией.
  #  Аттестация — не подпись Authenticode (её для exe пока нет: нужен
  #  сертификат), но она привязывает файл к этому запуску сборки: проверить,
  #  что он собран здесь из этого коммита, можно командой
  #      gh attestation verify Win11Privacy.exe --repo <владелец>/Win11Privacy
  # --------------------------------------------------------------------------- #
  release:
    name: Публикация релиза
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write        # создать релиз и приложить файлы
      id-token: write        # подпись происхождения (аттестация)
      attestations: write

    steps:
      - name: Получить исходники
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Получить файлы релиза
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-files

      - name: Сверить файлы с контрольными суммами
        shell: pwsh
        run: |
          # между заданиями файлы лежат как артефакт: перед публикацией
          # убеждаемся, что их хеши — те, что посчитала сборка
          $bad = 0
          foreach ($line in Get-Content SHA256SUMS.txt) {
              if ($line -notmatch '^([0-9a-f]{64})\s+(\S+)$') { throw "непонятная строка в SHA256SUMS.txt: $line" }
              $want = $Matches[1]; $file = $Matches[2]
              $got = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLower()
              if ($got -ne $want) { Write-Host "::error::хеш $file не совпал: $got вместо $want"; $bad++ }
              else { Write-Host "$got  $file" }
          }
          if ($bad -gt 0) { throw "файлы релиза не совпали с контрольными суммами" }

      - name: Подтвердить происхождение файлов
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            Win11Privacy.exe
            Win11-Privacy-Engine.ps1

      - name: Выложить в релиз
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            Win11Privacy.exe
            Win11-Privacy-Engine.ps1
            SHA256SUMS.txt
            winget-manifest.zip
          body_path: release-notes.md

      # Каталог winget за релизами не следит: на каждую версию нужен свой
      # pull request. Отправляем его сразу после публикации — если в секретах
      # лежит токен с правом public_repo. Встроенный токен сборки в чужой
      # репозиторий писать не может, поэтому без секрета шаг просто молчит.
      - name: Отправить манифест в каталог winget
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          if (-not $env:GH_TOKEN) {
              Write-Host "секрет WINGET_TOKEN не задан - манифест в каталог не отправляем"
              exit 0
          }
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          python tools/submit_winget.py --version $version --sums SHA256SUMS.txt

